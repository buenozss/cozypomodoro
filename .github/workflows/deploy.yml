
name: Deploy CozyPomodoro

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Atualizar aplicação na EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/cozypomodoro.pem
          chmod 600 ~/.ssh/cozypomodoro.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Atualizar aplicação na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/cozypomodoro.pem "$EC2_USER@$EC2_HOST" '
            cd /home/ubuntu/cozypomodoro &&
            git fetch origin develop &&
            git reset --hard origin/develop &&
            npm ci --omit=dev &&
            sudo systemctl restart cozypomodoro &&
            sudo systemctl is-active cozypomodoro
          '
